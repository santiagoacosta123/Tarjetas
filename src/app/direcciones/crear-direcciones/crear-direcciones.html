<h2 class="text-2xl font-bold text-zinc-900 mb-2">
  Nueva Dirección
</h2>

<p class="text-slate-500 mb-6">
  Registra una nueva dirección
</p>


<form
  (ngSubmit)="crearDireccion()"
  class="bg-white p-8 rounded-lg shadow-md border border-slate-200">


  <div class="mb-5">

    <label class="block mb-2 text-zinc-700 font-semibold">
      Dirección
    </label>

    <input
      type="text"
      placeholder="Escriba la dirección"
      [(ngModel)]="direccion.address"
      name="address"
      class="w-full border border-slate-300 p-3 rounded">

  </div>


  <div class="mb-5">

    <label class="block mb-2 text-zinc-700 font-semibold">
      Barrio
    </label>

    <input
      type="text"
      placeholder="Escriba el barrio"
      [(ngModel)]="direccion.district"
      name="district"
      class="w-full border border-slate-300 p-3 rounded">

  </div>


  <div class="mb-5">

    <label class="block mb-2 text-zinc-700 font-semibold">
      ID de la Ciudad
    </label>

    <input
      type="number"
      placeholder="Escriba el ID de la ciudad"
      [(ngModel)]="direccion.city_id"
      name="city_id"
      class="w-full border border-slate-300 p-3 rounded">

  </div>


  <div class="mb-6">

    <label class="block mb-2 text-zinc-700 font-semibold">
      Teléfono
    </label>

    <input
      type="text"
      placeholder="Escriba el teléfono"
      [(ngModel)]="direccion.phone"
      name="phone"
      class="w-full border border-slate-300 p-3 rounded">

  </div>


  <button
    type="submit"
    class="bg-zinc-900 text-white px-5 py-3 rounded hover:bg-zinc-800">

    Crear Dirección

  </button>

</form>
