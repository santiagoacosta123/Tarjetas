<div class="p-6">

  <h1 class="text-3xl font-bold text-zinc-900 mb-2">
    Gestión de Direcciones
  </h1>

  <p class="text-slate-500 mb-6">
    Administra las direcciones
  </p>

  <div class="flex gap-3 mb-6">

    <button
      (click)="mostrar('listar')"
      class="bg-zinc-900 text-white px-5 py-3 rounded">
      Listar
    </button>

    <button
      (click)="mostrar('crear')"
      class="bg-zinc-900 text-white px-5 py-3 rounded">
      Nueva dirección
    </button>

    <button
      (click)="mostrar('actualizar')"
      class="bg-zinc-900 text-white px-5 py-3 rounded">
      Actualizar
    </button>

  </div>

  <div [class.hidden]="seccion !== 'listar'">
    <app-listar-direcciones></app-listar-direcciones>
  </div>

  <div [class.hidden]="seccion !== 'crear'">
    <app-crear-direcciones></app-crear-direcciones>
  </div>

  <div [class.hidden]="seccion !== 'actualizar'">
    <app-actualizar-direcciones></app-actualizar-direcciones>
  </div>

</div>
