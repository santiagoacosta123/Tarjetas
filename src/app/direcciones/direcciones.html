<div class="p-6">

  <h1 class="text-3xl font-bold text-zinc-900 mb-2">
    Gestión de Direcciones
  </h1>

  <p class="text-slate-500 mb-6">
    Administra las direcciones del sistema
  </p>


  <div class="flex gap-3 mb-6">

    <button
      (click)="mostrarListar()"
      class="bg-zinc-900 text-white px-5 py-3 rounded hover:bg-zinc-800">

       Listar

    </button>


    <button
      (click)="mostrarCrear()"
      class="bg-zinc-900 text-white px-5 py-3 rounded hover:bg-zinc-800">

      Nueva dirección

    </button>


    <button
      (click)="mostrarActualizar()"
      class="bg-zinc-900 text-white px-5 py-3 rounded hover:bg-zinc-800">

       Actualizar

    </button>

  </div>


  <div class="bg-white p-8 rounded-lg shadow-md border border-slate-200">

    @if (vista === 'listar') {

      <app-listar-direcciones></app-listar-direcciones>

    }

    @if (vista === 'crear') {

      <app-crear-direcciones></app-crear-direcciones>

    }

    @if (vista === 'actualizar') {

      <app-actualizar-direcciones></app-actualizar-direcciones>

    }

  </div>

</div>
