<div class="p-8">

  <div class="max-w-2xl mx-auto">

    <h1 class="text-3xl font-bold text-zinc-900 mb-2">Actualizar Ciudad</h1>

    <p class="text-slate-500 mb-6">Modifica la información de la ciudad</p>

    <form
      (ngSubmit)="actualizarCiudad()" class="bg-white p-8 rounded-lg shadow-md border border-slate-200">

      <div class="mb-5">
        <label class="block mb-2 text-zinc-700 font-semibold">Ciudad</label>

        <input type="text" placeholder="Escriba la ciudad" [(ngModel)]="ciudad.city" name="city" class="w-full border border-slate-300 p-3 rounded">
      </div>

      <div class="mb-6">
        <label class="block mb-2 text-zinc-700 font-semibold">ID del País</label>

        <input type="number" placeholder="Escriba el ID del país" [(ngModel)]="ciudad.country_id" name="country_id" class="w-full border border-slate-300 p-3 rounded">
      </div>

      <button type="submit" class="bg-zinc-900 text-white px-5 py-3 rounded hover:bg-zinc-800">
        Actualizar Ciudad
      </button>

    </form>

  </div>

</div>
