<div class="p-6">

  <div class="max-w-4xl mx-auto">

    <div class="mb-5">

      <div class="flex items-center justify-between">

        <div>
          <h1 class="text-2xl font-bold text-zinc-900">Listado de Ciudades</h1>
          <p class="text-sm text-slate-500 mt-1"> </p>
        </div>

        <a routerLink="/formulario-ciudad" class="bg-zinc-900 hover:bg-zinc-800 text-white text-sm px-4 py-2 rounded-md transition">+ Crear Ciudad</a>
    </div>

    </div>

    <div class="bg-white rounded-lg shadow-md border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-zinc-900 text-white">

          <tr>
            <th class="px-4 py-3 text-left font-semibold">ID </th>

            <th class="px-4 py-3 text-left font-semibold">Ciudad</th>

            <th class="px-4 py-3 text-center font-semibold">Acciones</th>
          </tr>
        </thead>

        <tbody>

          @for (ciudad of ciudades; track ciudad.city_id) {

            <tr class="border-b border-slate-200 hover:bg-slate-50 transition">
              <td class="px-4 py-3 text-slate-600">{{ ciudad.city_id }}</td>

              <td class="px-4 py-3 font-medium text-zinc-800">{{ ciudad.city }}</td>

              <td class="px-4 py-3">

                <div class="flex justify-center items-center gap-2">

                  <button (click)="llevarAActualizar(ciudad.city_id)" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-800 border border-slate-300 text-xs font-medium px-3 py-1.5 rounded-md transition">Actualizar</button>

                  <button (click)="eliminarCiudad(ciudad.city_id)" class="bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium px-3 py-1.5 rounded-md transition">Eliminar</button>

                </div>
              </td>
            </tr>
          }

        </tbody>

      </table>

      @if (ciudades.length === 0) {

        <div class="text-center py-8">

          <p class="text-sm text-slate-500"> No hay ciudades registradas. </p>

          <a routerLink="/formulario-ciudad" class="inline-block mt-3 bg-zinc-900 hover:bg-zinc-800 text-white text-sm px-4 py-2 rounded-md transition">Crear primera ciudad</a>
        </div>
      }
    </div>
  </div>
</div>
