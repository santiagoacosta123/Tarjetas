<header class="bg-zinc-950 text-white shadow-lg">
  <div class="flex items-center justify-between px-6 py-4">
    <button
      (click)="menuH = !menuH"
      class="text-3xl font-bold hover:text-indigo-200 transition">
      ☰
    </button>
    <h1 class="text-2xl font-bold tracking-wide">
      Menu 
    </h1>
  </div>
</header>

<div class="flex min-h-[calc(100vh-76px)]">
    <aside class="bg-zinc-900 text-slate-300 shadow-xl border-r border-slate-800 transition-all duration-300 ease-in-out flex flex-col"
           [class.w-64]="menuH" [class.w-20]="!menuH">
        
        <nav class="flex flex-col gap-2 p-4">

            <a routerLink="/listar-clientes" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 hover:text-white" title="Clientes">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                
                @if(menuH) {
                    <span>Clientes</span>
                }
            </a>

            <a routerLink="/direcciones" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 hover:text-white" title="Direcciones">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                
                @if(menuH) {
                    <span>Direcciones</span>
                }
            </a>

            <a routerLink="/listar-ciudad" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 hover:text-white" title="Ciudades">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                
                @if(menuH) {
                    <span>Ciudades</span>
                }
            </a>

            <a routerLink="/" class="flex items-center gap-4 p-3 rounded-xl hover:bg-zinc-800 hover:text-white" title="Países">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                
                @if(menuH) {
                    <span>Países</span>
                }
            </a>

        </nav>

    </aside>

    <main class="flex-1 p-6 bg-slate-50 transition-all duration-300 ease-in-out w-full">
      <router-outlet></router-outlet>
    </main>
</div>
