<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">

  <h2 class="text-2xl font-bold text-center mb-6">
    Actualizar País
  </h2>

  <p class="mb-2 font-medium">
    ID del país: {{ idPais }}
  </p>

  <label class="block font-medium mb-2">
    País actual
  </label>

  <input
    type="text"
    [(ngModel)]="pais.country"
    name="country"
    class="w-full border border-gray-300 rounded-lg p-3 mb-5"
  >

  <button
    (click)="actualizarPais()"
    class="w-full bg-yellow-500 text-white py-3 rounded-lg">
    Actualizar país
  </button>

</div>
